<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | NIT KKR Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<div class="bg"></div>

<div class="container">

<!-- Navbar -->
<nav class="navbar glass fade-in">
  <div class="nav-left">
    <img src="nitlogo.png" alt="Logo" class="nav-logo" />
    <span class="nav-title">NIT KKR Marketplace</span>
  </div>

  <div class="nav-right">
    <a href="profile.html">
      <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-icon"/>
    </a>
  </div>
</nav>


<!-- Welcome -->
<section class="welcome fade-in delay-1">
  <h1>Dashboard</h1>
  <p id="welcome-user"></p>
  <p>Choose what you want to do in the marketplace.</p>
</section>


<!-- Actions -->
<section class="actions fade-in delay-2">

  <div class="action-card glass">
    <h2>Buy Items</h2>
    <p>Browse items listed by students and staff within campus.</p>
    <a href="buy.html" class="action-link">
      <button>Go to Buy Section</button>
    </a>
  </div>

  <div class="action-card glass">
    <h2>Sell Items</h2>
    <p>List your items for sale to the campus community.</p>
    <a href="sell.html" class="action-link">
      <button>Go to Sell Section</button>
    </a>
  </div>

  <div class="action-card glass">
    <h2>My Listings</h2>
    <p>View and manage items you have listed for sale.</p>
    <a href="mylistings.html" class="action-link">
      <button>View My Listings</button>
    </a>
  </div>

</section>


<!-- Footer -->
<footer class="footer fade-in delay-3">
  <p>© 2026 NIT Kurukshetra</p>
</footer>

</div>


<script>

const API_BASE = "http://localhost:3000";

async function loadDashboard() {

  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "index.html";
    return;
  }

  const res = await fetch(`${API_BASE}/api/user/me`, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const user = await res.json();

  document.getElementById("welcome-user").innerText =
    "Welcome, " + user.name + "!";

}

loadDashboard();

</script>

</body>
</html>
